<style>

<body>
<div class="shell">
  <header class="top">
    <h1 class="mark">AXIOMATTER<small>MorphTile workshop v0.4 — one substrate, read as many forms</small></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="strip" id="strip" hidden></div>
  <div class="left">
    <div class="forms" role="group" aria-label="Read this matter as" id="forms"></div>
    <div class="stage" id="stage"></div>
    <p class="note" id="stageNote"></p>
  </div>
  <div class="right">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>
<script>/*__CORE__*/</script>
<script>
const FIXTURES = /*__FIXTURES__*/null, SOURCE = /*__SOURCE__*/null;
(function () {
'use strict';
const MT = MorphTile, $ = (id) => document.getElementById(id), KEY = 'morphtile.workspace.v1', SHELF = 'morphtile.shelf.v1';
// The shelf is a list of whole tiles, kept in this browser. Each entry is the tile itself, so a shelf entry IS matter, not a preview of it.
function shelfRead() { try { return JSON.parse(localStorage.getItem(SHELF) || '[]'); } catch (e) { return []; } }
function shelfWrite(list) { try { localStorage.setItem(SHELF, JSON.stringify(list)); return true; } catch (e) { toast('This browser would not save the shelf: ' + e.message, true); return false; } }
function download(name, text, type) { const blob = new Blob([text], { type: type || 'application/json' }), url = URL.createObjectURL(blob), a = el('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
function openFile(accept, then) { const i = el('input', { type: 'file', accept: accept || '.json,application/json' }); i.addEventListener('change', () => { const f = i.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { then(JSON.parse(r.result)); } catch (e) { toast('That file is not valid JSON: ' + e.message, true); } }; r.onerror = () => toast('That file could not be read.', true); r.readAsText(f); }); i.click(); }
const el = (tag, props, ...kids) => { const n = document.createElement(tag); for (const k in props || {}) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k === 'text') n.textContent = v; else if (k in n && k !== 'list') n[k] = v; else n.setAttribute(k, v === true ? '' : v); } for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c)); return n; };
const LOGIC = {
  none: { type: 'none', data: {} },
  toggle: { type: 'rule', data: { vars: { on: 0 }, rules: [{ on: 'toggle', do: [{ set: ['on', ['-', 1, ['var', 'on']]] }, { emit: 'changed' }] }] } },
  counter: { type: 'rule', data: { vars: { count: 0 }, rules: [{ on: 'press', do: [{ set: ['count', ['+', ['var', 'count'], 1]] }, { emit: 'pressed' }] }] } },
  battery: { type: 'rule', data: { vars: { charge: { accrue: { rate: 0.5, cap: 100 }, base: 0 } }, rules: [{ on: 'drain', do: [{ set: ['charge', 0] }, { emit: 'drained' }] }] } },
};
const LOGIC_SOCKETS = { toggle: [['toggle', 'in'], ['changed', 'out']], counter: [['press', 'in'], ['pressed', 'out']], battery: [['drain', 'in'], ['drained', 'out']] };

let ws, ui = { form: 'world', tab: 'tiles', sel: 'mt_tower', cand: null, plan: null, cam: { yaw: 0.7, pitch: 0.3, dist: 19 }, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches, anchor: performance.now(), rebuilt: null, offers: {}, door: null, facetEdit: 'material', open: {}, presentations: {}, scope: '', picks: {}, autoSettle: true, within: 0, settled: null };
function load() { try { const raw = localStorage.getItem(KEY); if (raw) return MT.importWorkspace(JSON.parse(raw)); } catch (e) { toast('Saved workspace could not be replayed, starting from genesis. ' + e.message, true); } return MT.createWorkspace(MT.seedWorld()); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(MT.exportWorkspace(ws))); } catch (e) {} }
ws = load();

const registry = MT.createRegistry();
registry.advertise({ id: 'form:game_asset', produces: 'game_asset', by: 'morphtile-native', note: 'software rasterizer, deterministic' }); registry.bind('form:game_asset', MT.renderAsset);
registry.advertise({ id: 'form:ui_panel', produces: 'ui_panel', by: 'morphtile-native', note: 'vnode tree, host mounts it' }); registry.bind('form:ui_panel', MT.compilePanel);
registry.advertise({ id: 'form:website', produces: 'website', by: 'morphtile-native', note: 'static HTML export' }); registry.bind('form:website', MT.compileWebsite);
registry.advertise({ id: 'form:glb_export', produces: 'glb', by: 'external:Axm-game-assets', note: 'declared, no local executor yet' });
registry.advertise({ id: 'uc:asset_package_read', produces: 'mesh', by: 'external:axm-universal-creation', note: 'declared, no local executor yet' });

let toastTimer; function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), err ? 6000 : 2600); }
const now = () => ws.live.time + (ui.playing ? (performance.now() - ui.anchor) / 1000 : 0);
function syncTime() { const t = now(); if (t > ws.live.time) MT.act(ws, { do: 'tick', to: Math.round(t * 1000) / 1000 }); ui.anchor = performance.now(); }
function viewWorld() { const c = ui.cand && ws.candidates[ui.cand]; return c ? Object.assign({}, c.world, { vars: MT.rekeyVars(MT.clone(ws.live.vars), c.rekeys), time: ws.live.time }) : ws.live; }
// A parameter control edits real matter, so it goes through the same clone -> plan -> commit path as every other edit.
function setParam(tile, id, value) { edit({ op: 'param.set', id: tile, param: id, value }); }
function signal(tile, name, by) { syncTime(); const r = MT.act(ws, { do: 'signal', tile, name }, by || 'human'); if (!r.ok) toast(r.error, true); changed(); }
function edit(op) { // every structural edit lands on a disposable clone first
  if (!ui.cand || !ws.candidates[ui.cand]) ui.cand = MT.act(ws, { do: 'clone', label: 'draft' }, 'human').candidate;
  const r = MT.act(ws, { do: 'edit', candidate: ui.cand, op }, 'human');
  if (!r.ok) toast(r.error + (r.errors ? ': ' + r.errors.join('; ') : ''), true);
  ui.plan = null; changed(); return r.ok;
}
function changed() { save(); renderAll(); }

// ---------- stage
const FORMS = [['world', 'World'], ['panel', 'Panel'], ['text', 'Text'], ['site', 'Website'], ['matter', 'Matter']];
let canvas, ctx2d, target, image, lastFrame = null, raf = 0;
function settleWorld() { // ask the world what it wants woken where the viewer is standing, then record it
  if (!ui.autoSettle) return false;
  const cam = ui.cam, cp = Math.cos(cam.pitch), tgt = cam.target || [0, 1.4, 0];
  const from = [tgt[0] + cam.dist * cp * Math.sin(cam.yaw), tgt[1] + cam.dist * Math.sin(cam.pitch), tgt[2] + cam.dist * cp * Math.cos(cam.yaw)];
  if (!MT.pendingWakes(ws.live, { from, t: now() }).length) return false;
  syncTime(); const r = MT.act(ws, { do: 'settle', from, t: now() }, 'human');
  if (r.changes && r.changes.length) { save(); ui.settled = r.changes.length + ' capability change' + (r.changes.length === 1 ? '' : 's') + ' as you moved'; }
  return true;
}
function drawWorld() {
  if (!canvas) return;
  settleWorld();
  lastFrame = MT.renderAsset(viewWorld(), { width: canvas.width, height: canvas.height, t: now(), camera: ui.cam, target, highlight: ui.sel, within: ui.within || undefined });
  target = lastFrame.target;
  if (!image || image.width !== canvas.width) image = ctx2d.createImageData(canvas.width, canvas.height);
  image.data.set(lastFrame.pixels); ctx2d.putImageData(image, 0, 0);
}
let lastTick = 0;
function loop(ts) { raf = requestAnimationFrame(loop); if (ts - lastTick < 33) return; lastTick = ts; if (ui.form === 'world' && ui.playing && !document.hidden) drawWorld(); if (ui.form === 'panel' && ui.playing && ts % 250 < 40) refreshBinds(); }
function refreshBinds() { const w = viewWorld(), t = now(); document.querySelectorAll('[data-bind]').forEach((n) => { const [id, name] = n.dataset.bind.split('|'); if (MT.resolveTile(w, id)) { const v = MT.getVar(w, id, name, t); n.textContent = typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : v; } }); }
function mount(v) { const n = el(v.tag, { class: v.cls, text: v.text }); if (v.style) for (const k in v.style) n.style.setProperty(k, v.style[k]); if (v.attrs) for (const k in v.attrs) n.setAttribute(k, v.attrs[k]); if (v.tile) { n.dataset.tile = v.tile; }
  if (v.param) { const out = () => n.parentNode && n.parentNode.querySelector('output'); n.addEventListener('input', (e) => { e.stopPropagation(); if (out()) out().textContent = e.target.value; }); n.addEventListener('change', (e) => { e.stopPropagation(); setParam(v.param.tile, v.param.id, e.target.value); }); n.addEventListener('click', (e) => e.stopPropagation()); } if (v.bind) n.dataset.bind = v.bind.tile + '|' + v.bind.name; if (v.on) n.addEventListener('click', (e) => { e.stopPropagation(); signal(v.on.tile, v.on.name); }); if (v.toggle) n.addEventListener('click', (e) => { e.stopPropagation(); ui.open[v.toggle] = !ui.open[v.toggle]; renderStage(); }); for (const c of v.children) n.append(mount(c)); return n; }
function renderStage() {
  const st = $('stage'); st.textContent = ''; canvas = null; const w = viewWorld();
  if (ui.form === 'world') {
    canvas = el('canvas', { width: 360, height: 300, 'aria-label': 'The world read as game assets. Drag to orbit, tap a tile to select it.' }); ctx2d = canvas.getContext('2d'); st.append(canvas);
    let drag = null;
    canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); });
