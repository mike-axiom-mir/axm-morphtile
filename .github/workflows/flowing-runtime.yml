name: Flowing runtime

on:
  push:
    branches:
      - chatgpt/flowing-runtime-v01
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full MorphTile tests
        run: npm test
      - name: Flowing runtime focused tests
        run: node --test test/flowing-runtime.js
      - name: Build one-file workshop
        run: npm run build
