name: bounded-recipe-own-key-repair

on:
  push:
    branches:
      - form/recipe-own-key-identity-20260920
    paths:
      - .github/workflows/form-recipe-own-key-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: form/recipe-own-key-identity-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/form-recipe-own-key-repair.js
      - run: node --test test/recipe-own-key-identity.js
      - run: npm test
      - run: npm run build
      - run: npm run conformance
      - name: Commit bounded repair
        run: |
          git config user.name "AXM Form Geometry Machine"
          git config user.email "actions@github.com"
          git add core/morphtile.js
          git commit -m "fix: preserve recipe own-key identity"
          git push origin HEAD:form/recipe-own-key-identity-20260920
