name: bounded-kit-own-key-repair

on:
  push:
    branches: [core-kit-own-key-identity]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[kit-own-key-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core-kit-own-key-identity
      - name: Apply bounded registry own-key repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/morphtile.js')
          text = path.read_text()
          replacements = [
            (
              "  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));\n",
              "  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));\n  const hasOwn = (o, k) => !!o && Object.prototype.hasOwnProperty.call(o, k);\n  function putOwn(o, k, v) { Object.defineProperty(o, k, { value: v, enumerable: true, configurable: true, writable: true }); return v; }\n"
            ),
            (
              "        world.words = world.words || {};\n        world.words[name] = { name, args: clone(op.args || []), body: clone(op.body), note: op.note || null };\n",
              "        world.words = world.words || {};\n        putOwn(world.words, name, { name, args: clone(op.args || []), body: clone(op.body), note: op.note || null });\n"
            ),
            (
              "      case 'def.put': { world.defs = world.defs || {}; if (!op.id) throw new Error('a definition needs an id'); world.defs[op.id] = { id: op.id, name: op.name || op.id, body: clone(op.body), created_by: op.by || 'human' }; break; }\n",
              "      case 'def.put': { world.defs = world.defs || {}; if (!op.id) throw new Error('a definition needs an id'); putOwn(world.defs, op.id, { id: op.id, name: op.name || op.id, body: clone(op.body), created_by: op.by || 'human' }); break; }\n"
            ),
            (
              "  function exportWords(world, names) {\n    const src = world.words || {}, pick = {};\n    for (const k of (names && names.length ? names : Object.keys(src)).sort()) if (src[k]) pick[k] = clone(src[k]);\n",
              "  function exportWords(world, names) {\n    const src = world.words || {}, pick = {};\n    for (const k of (names && names.length ? names : Object.keys(src)).sort()) if (hasOwn(src, k)) putOwn(pick, k, clone(src[k]));\n"
            ),
            (
              "      if (mine[k]) { if (canonical(mine[k]) === canonical(w)) { already.push(k); continue; } if (!opts.overwrite) { conflicts.push({ name: k, why: 'this world has a different word by that name', mine: mine[k], theirs: w }); continue; } }\n",
              "      if (hasOwn(mine, k)) { if (canonical(mine[k]) === canonical(w)) { already.push(k); continue; } if (!opts.overwrite) { conflicts.push({ name: k, why: 'this world has a different word by that name', mine: mine[k], theirs: w }); continue; } }\n"
            ),
            (
              "      if (mine) { if (canonical(mine.body) === canonical(theirs.body)) { already.push(id); continue; } if (!opts.overwrite) { conflicts.push({ name: id, why: 'this world has a different definition by that name' }); continue; } }\n",
              "      if (hasOwn(world.defs || {}, id)) { if (canonical(mine.body) === canonical(theirs.body)) { already.push(id); continue; } if (!opts.overwrite) { conflicts.push({ name: id, why: 'this world has a different definition by that name' }); continue; } }\n"
            )
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one bounded source match, found {count}: {old[:80]!r}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit bounded repair
        run: |
          git config user.name "mike-axiom-mir"
          git config user.email "miketobi90@gmail.com"
          git add core/morphtile.js
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix: preserve kit registry own-key identity [kit-own-key-repair]"
          git push origin HEAD:core-kit-own-key-identity
