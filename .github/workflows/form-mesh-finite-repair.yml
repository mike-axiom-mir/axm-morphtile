name: bounded mesh finite repair

on:
  push:
    branches:
      - form/mesh-nonfinite-runtime-boundary

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: form/mesh-nonfinite-runtime-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded shared mesh-output repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/morphtile.js')
          text = path.read_text()
          old = """    } else for (const part of (mf.data && mf.data.parts) || [mf.data || {}]) addPart(out, part);\n    const paint = md.paint; // {vars, color: [expr, expr, expr] over x, y, z, and the tile's own numbers}\n"""
          new = """    } else for (const part of (mf.data && mf.data.parts) || [mf.data || {}]) addPart(out, part);\n    if (out.P.some((value) => typeof value !== 'number' || !Number.isFinite(value))) {\n      out.P = []; out.T = []; out.K = [];\n      if (!out.hold) out.hold = 'HOLD_MESH_NONFINITE_VALUE';\n    }\n    const paint = md.paint; // {vars, color: [expr, expr, expr] over x, y, z, and the tile's own numbers}\n"""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one shared compile boundary')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/form-mesh-finite-repair.yml
      - run: npm test
      - run: npm run build
      - run: npm run conformance
      - name: Commit bounded repair
        run: |
          git config user.name "AXM Form Geometry Machine"
          git config user.email "actions@github.com"
          git add core/morphtile.js .github/workflows/form-mesh-finite-repair.yml
          git commit -m "Fail closed on non-finite compiled mesh geometry"
          git push origin HEAD:form/mesh-nonfinite-runtime-boundary
