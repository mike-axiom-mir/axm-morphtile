name: core17-repair-once

on:
  push:
    branches:
      - interface-core/repeat-scoped-text-regression-20260921

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interface-core/repeat-scoped-text-regression-20260921
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded repeat-scope repair
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'core/morphtile.js';
          let s = fs.readFileSync(p, 'utf8');
          const once = (from, to, label) => {
            const first = s.indexOf(from);
            if (first < 0) throw new Error('missing expected source: ' + label);
            if (s.indexOf(from, first + from.length) >= 0) throw new Error('expected exactly one source occurrence: ' + label);
            s = s.slice(0, first) + to + s.slice(first + from.length);
          };
          const evs = "      const evs = (e, d) => { if (e === undefined) return d; const v = evalExpr(e, { t, words: wordsOf(world), get: (k) => (sctx && k in sctx ? sctx[k] : getVar(world, path, k, t, 0, tile)) }); return v === null || v === undefined ? d : v; };";
          once(evs, evs + "\n      const labels = (e, d) => { const v = evs(e, d); return v === undefined || v === null ? d : (typeof v === 'number' ? fmt(v) : String(v)); };", 'scoped evaluator');
          once("text: label(n.text, '')", "text: labels(n.text, '')", 'repeated text');
          once("text: label(n.label, '')", "text: labels(n.label, '')", 'meter label');
          once("text: label(n.label, sock.label || n.button)", "text: labels(n.label, sock.label || n.button)", 'button label');
          once("text: label(n.label, p2.label || p2.id)", "text: labels(n.label, p2.label || p2.id)", 'control label');
          fs.writeFileSync(p, s);
          NODE
      - name: Run full core proof
        run: |
          npm test
          npm run build
          npm run conformance
      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/core17-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/morphtile.js .github/workflows/core17-repair-once.yml
          git commit -m "Repair repeat-scoped view expression labels"
          git push origin HEAD:interface-core/repeat-scoped-text-regression-20260921
