name: repair recipe nonfinite boundary

on:
  push:
    branches:
      - candidate/form-recipe-nonfinite-fail-closed

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded core repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'core/morphtile.js';
          let src = fs.readFileSync(path, 'utf8');
          const oldNum = "    const num = (v, scope, d) => { if (v === undefined) return d; const x = evalExpr(v, { t: 0, words: wordsOf(world), get: (n) => (n in scope ? scope[n] : vars[n]) }); return typeof x === 'number' && isFinite(x) ? x : d; };";
          const newNum = "    const NONFINITE_RECIPE_VALUE = {};\n    const num = (v, scope, d) => {\n      if (v === undefined) return d;\n      const x = evalExpr(v, { t: 0, words: wordsOf(world), get: (n) => (n in scope ? scope[n] : vars[n]) });\n      if (typeof x === 'number' && !Number.isFinite(x)) { stopped = stopped || 'HOLD_RECIPE_NONFINITE_VALUE'; throw NONFINITE_RECIPE_VALUE; }\n      return typeof x === 'number' ? x : d;\n    };";
          if (!src.includes(oldNum)) throw new Error('expected runRecipe num() boundary not found exactly once');
          if (src.indexOf(oldNum) !== src.lastIndexOf(oldNum)) throw new Error('runRecipe num() boundary matched more than once');
          src = src.replace(oldNum, newNum);
          const oldWalk = "    walk(data.parts, {}, 0);\n    if (stopped) { out.hold = stopped; if (!ctx.depth) addPart(out, { shape: 'box', size: [1, 1, 1], color: [1, 0.7, 0.3] }); }";
          const newWalk = "    try { walk(data.parts, {}, 0); } catch (err) { if (err !== NONFINITE_RECIPE_VALUE) throw err; }\n    if (stopped) { out.hold = stopped; if (!ctx.depth) addPart(out, { shape: 'box', size: [1, 1, 1], color: [1, 0.7, 0.3] }); }";
          if (!src.includes(oldWalk)) throw new Error('expected runRecipe walk boundary not found exactly once');
          if (src.indexOf(oldWalk) !== src.lastIndexOf(oldWalk)) throw new Error('runRecipe walk boundary matched more than once');
          src = src.replace(oldWalk, newWalk);
          fs.writeFileSync(path, src);
          NODE
      - name: Commit repaired exact head locally
        shell: bash
        run: |
          git config user.name "AXM Form Geometry Machine"
          git config user.email "actions@github.com"
          git add core/morphtile.js
          git rm .github/workflows/repair-recipe-nonfinite.yml
          git commit -m "Fail closed on non-finite recipe values"
          echo "REPAIRED_HEAD=$(git rev-parse HEAD)"
      - name: Test exact repaired head
        shell: bash
        run: |
          echo "Testing exact head $(git rev-parse HEAD)"
          npm test
          npm run build
          npm run conformance
      - name: Push only after exact-head evidence passes
        shell: bash
        run: git push origin HEAD:candidate/form-recipe-nonfinite-fail-closed
